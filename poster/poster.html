<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Daily Orbit — Wednesday 25 November 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; }
  body {
    font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    background: #f6f1e5;
    color: #16181d;
  }
  .page {
    width: 1024px; height: 1024px;
    padding: 20px 36px 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* ---------- masthead ---------- */
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 54px; font-weight: 700; letter-spacing: 4px; line-height: 1.02;
  }
  .mastmeta {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 3px solid #16181d; border-bottom: 1px solid #16181d;
    padding: 5px 2px; margin-top: 7px;
    font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  }
  /* ---------- date band ---------- */
  .dateband {
    margin-top: 10px; background: #16181d; color: #f6f1e5;
    text-align: center; font-size: 42px; font-weight: 800; letter-spacing: 3px;
    padding: 7px 0 9px;
  }
  /* ---------- lead ---------- */
  .lead { margin-top: 11px; }
  .kicker { font-size: 16px; font-weight: 800; letter-spacing: 2.5px; color: #b3271e; text-transform: uppercase; }
  .leadart { display: block; width: 100%; height: 132px; margin-top: 6px; }
  .lead h2 { font-size: 45px; font-weight: 800; line-height: 1.04; margin-top: 7px; letter-spacing: 0.2px; }
  .lead .caption { font-size: 22px; line-height: 1.28; color: #2c313a; margin-top: 4px; }
  /* ---------- grid ---------- */
  .rule { border-top: 3px solid #16181d; margin: 11px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 20px; }
  .cell { border-top: 3px solid #16181d; padding-top: 8px; }
  .span2 { grid-column: span 2; }
  .span3 { grid-column: span 3; }
  .cell .kick { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #b3271e; text-transform: uppercase; }
  .cell .row { display: flex; gap: 11px; margin-top: 5px; align-items: flex-start; }
  .cell .icon { flex: 0 0 68px; width: 68px; height: 68px; }
  .cell h3 { font-size: 24px; font-weight: 800; line-height: 1.13; }
  .cell .cap { font-size: 19px; line-height: 1.26; color: #2c313a; margin-top: 5px; }
  /* ---------- footer ---------- */
  .footer { margin-top: auto; border-top: 3px solid #16181d; padding-top: 8px; }
  .footer .alsotitle { font-size: 16px; font-weight: 800; letter-spacing: 2.5px; }
  .footer .item { font-size: 19px; line-height: 1.36; color: #1d2129; white-space: nowrap; }
  .footer .item b { color: #b3271e; font-weight: 800; }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>{{TITLE}}</h1>
    <div class="mastmeta"><span>{{TAGLINE}}</span><span>One day &middot; One page</span></div>
  </header>

  <div class="dateband">{{DATELINE}}</div>

  <section class="lead">
    <div class="kicker">{{LEAD_KICKER}}</div>
    <svg class="leadart" viewBox="0 0 952 160" preserveAspectRatio="none" aria-label="Two oil tankers in a strait, one struck by a naval mine, with an explosion burst and smoke">
      <rect x="0" y="0" width="952" height="160" fill="#cfe0ea"/>
      <!-- sun -->
      <circle cx="852" cy="30" r="24" fill="#f2c230"/>
      <!-- distant headlands -->
      <polygon points="0,118 120,84 260,118 0,118" fill="#7d8ea0"/>
      <polygon points="952,118 830,80 700,118 952,118" fill="#7d8ea0"/>
      <!-- sea -->
      <rect x="0" y="112" width="952" height="48" fill="#2e5d7a"/>
      <g stroke="#7fa8bd" stroke-width="3" stroke-linecap="round">
        <line x1="40" y1="126" x2="120" y2="126"/><line x1="620" y1="132" x2="720" y2="132"/>
        <line x1="780" y1="124" x2="880" y2="124"/><line x1="180" y1="140" x2="260" y2="140"/>
      </g>
      <!-- mine spheres -->
      <g fill="#16181d">
        <circle cx="300" cy="104" r="7"/><circle cx="300" cy="104" r="2.5" fill="#f6f1e5"/>
        <circle cx="668" cy="100" r="7"/><circle cx="668" cy="100" r="2.5" fill="#f6f1e5"/>
      </g>
      <g stroke="#16181d" stroke-width="2.5" stroke-linecap="round">
        <line x1="300" y1="97" x2="300" y2="90"/><line x1="293" y1="104" x2="286" y2="104"/><line x1="307" y1="104" x2="314" y2="104"/>
        <line x1="668" y1="93" x2="668" y2="86"/><line x1="661" y1="100" x2="654" y2="100"/><line x1="675" y1="100" x2="682" y2="100"/>
      </g>
      <!-- tanker 1 (left, burning) -->
      <g>
        <polygon points="96,118 96,96 120,96 120,88 132,88 132,96 300,96 316,118" fill="#8c2f26"/>
        <rect x="104" y="98" width="196" height="20" fill="#b3271e"/>
        <rect x="140" y="76" width="60" height="20" fill="#f6f1e5"/>
        <rect x="206" y="82" width="10" height="14" fill="#232a33"/>
        <rect x="230" y="82" width="10" height="14" fill="#232a33"/>
        <polygon fill="#e2571e" points="196,86 204,66 222,76 234,58 242,76 262,68 250,86 268,92 244,96 250,110 230,100 220,114 214,96 194,104 202,92"/>
        <polygon fill="#f2a03d" points="214,72 220,84 234,78 232,90 244,92 232,98 236,108 224,100 216,108 216,94 204,96 210,86"/>
        <circle cx="276" cy="52" r="14" fill="#8b959e" opacity="0.85"/>
        <circle cx="306" cy="40" r="18" fill="#8b959e" opacity="0.65"/>
        <circle cx="340" cy="32" r="22" fill="#8b959e" opacity="0.45"/>
      </g>
      <!-- tanker 2 (right, intact) -->
      <g>
        <polygon points="640,118 640,98 664,98 664,90 676,90 676,98 836,98 852,118" fill="#3c4a57"/>
        <rect x="648" y="100" width="188" height="18" fill="#5a6b7c"/>
        <rect x="700" y="78" width="56" height="20" fill="#f6f1e5"/>
        <rect x="762" y="84" width="10" height="14" fill="#232a33"/>
        <rect x="786" y="84" width="10" height="14" fill="#232a33"/>
      </g>
      <!-- ground line -->
      <rect x="0" y="152" width="952" height="8" fill="#16181d"/>
    </svg>
    <h2>{{LEAD_HEADLINE}}</h2>
    <p class="caption">{{LEAD_CAPTION}}</p>
  </section>

  <div class="rule"></div>

  <main class="grid">
    {{STORY_CELLS}}
  </main>

  <footer class="footer">
    <div class="alsotitle">ALSO THAT DAY</div>
    {{ALSO_ITEMS}}
  </footer>

</div>
</body>
</html>
